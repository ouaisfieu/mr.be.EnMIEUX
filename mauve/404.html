<!DOCTYPE html>
<html lang="fr-BE">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page non trouvée - MR</title>
    <meta name="robots" content="noindex">
    <link rel="shortcut icon" href="https://www.mr.be/wp-content/uploads/2023/09/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
    :root{--blue:#002eff;--blue-dark:#0022cc;--white:#fff;--black:#000;--gray-100:#f3f4f6;--gray-600:#4b5563;--gray-800:#1f2937}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Open Sans',system-ui,sans-serif;font-size:14px;line-height:1.8;color:var(--gray-600);background:var(--white);min-height:100vh;display:flex;flex-direction:column}
    a{text-decoration:none;color:inherit;transition:all .3s}
    img{max-width:100%;height:auto;display:block}
    @font-face{font-family:'Open Sans';src:url('https://www.mr.be/wp-content/themes/salient/css/fonts/OpenSans-Regular.woff') format('woff');font-weight:400}
    @font-face{font-family:'Open Sans';src:url('https://www.mr.be/wp-content/themes/salient/css/fonts/OpenSans-Bold.woff') format('woff');font-weight:700}
    #header{position:fixed;top:0;left:0;right:0;z-index:10000;background:var(--white);height:70px;box-shadow:0 0 30px rgba(0,0,0,.1)}
    .header-inner{max-width:1400px;margin:0 auto;padding:0 60px;height:100%;display:flex;align-items:center;justify-content:center;position:relative}
    .logo{position:absolute;left:50%;transform:translateX(-50%)}
    .logo img{height:45px}
    .nav-left,.nav-right{position:absolute;display:flex;align-items:center;gap:5px}
    .nav-left{left:60px}.nav-right{right:60px}
    .nav-link{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;padding:0 15px;height:70px;display:flex;align-items:center;color:var(--black)}
    .nav-link:hover{color:var(--blue)}
    .btn-adhesion{background:var(--blue);color:var(--white)!important;padding:12px 20px;font-size:11px;font-weight:700;text-transform:uppercase;margin-left:10px}
    .btn-adhesion:hover{background:var(--blue-dark)}
    .mobile-toggle{display:none;width:25px;height:18px;flex-direction:column;justify-content:space-between;cursor:pointer;position:absolute;right:20px}
    .mobile-toggle span{height:2px;background:var(--black)}
    .error-page{flex:1;display:flex;align-items:center;justify-content:center;padding:150px 30px 80px;background:linear-gradient(135deg,#f5f7fa 0%,#e4e8ec 100%)}
    .error-content{text-align:center;max-width:600px}
    .error-code{font-size:160px;font-weight:700;color:var(--blue);line-height:1;margin-bottom:20px;text-shadow:4px 4px 0 rgba(0,46,255,.1)}
    .error-title{font-size:32px;font-weight:700;color:var(--black);margin-bottom:20px}
    .error-text{font-size:16px;color:var(--gray-600);margin-bottom:40px}
    .error-buttons{display:flex;gap:15px;justify-content:center;flex-wrap:wrap}
    .btn-error{display:inline-flex;align-items:center;gap:10px;padding:16px 32px;font-size:13px;font-weight:700;text-transform:uppercase;transition:all .3s}
    .btn-primary{background:var(--blue);color:var(--white)}
    .btn-primary:hover{background:var(--blue-dark);transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,46,255,.3)}
    .btn-outline{background:transparent;color:var(--blue);border:2px solid var(--blue)}
    .btn-outline:hover{background:var(--blue);color:var(--white)}
    .footer{background:var(--gray-800);color:var(--white);padding:30px 0;text-align:center}
    .footer p{font-size:13px;color:rgba(255,255,255,.6)}
    @media(max-width:1024px){.nav-left,.nav-right{display:none}.mobile-toggle{display:flex}.logo{position:relative;left:0;transform:none}.header-inner{justify-content:space-between}}
    @media(max-width:768px){.error-code{font-size:100px}.error-title{font-size:24px}.error-buttons{flex-direction:column}.btn-error{width:100%;justify-content:center}}
    </style>
</head>
<body>
<header id="header">
    <div class="header-inner">
        <nav class="nav-left">
            <a href="mouvement.html" class="nav-link">Mouvement</a>
            <a href="actualites.html" class="nav-link">Actu</a>
            <a href="agenda.html" class="nav-link">Agenda</a>
        </nav>
        <a href="index.html" class="logo"><img src="https://www.mr.be/wp-content/uploads/2023/09/Logonew-retina.png" alt="MR"></a>
        <nav class="nav-right">
            <a href="equipe.html" class="nav-link">Équipe</a>
            <a href="programme.html" class="nav-link">Programme</a>
            <a href="adhesion.html" class="btn-adhesion">Adhésion</a>
        </nav>
        <div class="mobile-toggle"><span></span><span></span><span></span></div>
    </div>
</header>
<main class="error-page">
    <div class="error-content">
        <div class="error-code">404</div>
        <h1 class="error-title">Page non trouvée</h1>
        <p class="error-text">Désolé, la page que vous recherchez n'existe pas ou a été déplacée.</p>
        <div class="error-buttons">
            <a href="index.html" class="btn-error btn-primary"><i class="fas fa-home"></i> Retour à l'accueil</a>
            <a href="contact.html" class="btn-error btn-outline"><i class="fas fa-envelope"></i> Nous contacter</a>
        </div>
    </div>
</main>
<footer class="footer">
    <p>© 2026 MR - Mouvement Réformateur. Tous droits réservés.</p>
</footer>
</body>
</html>
